name: Empty placeholder cleanup

on:
  push:
    branches:
      - agent/bootstrap-worldbuilding-blueprint
    paths:
      - scripts/cleanup_empty_placeholders.py
      - .github/workflows/empty-placeholder-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-worldbuilding-blueprint
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove only truly empty placeholders
        run: |
          python scripts/cleanup_empty_placeholders.py
          git diff --check

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove empty design placeholder files"
          git push origin HEAD:agent/bootstrap-worldbuilding-blueprint
